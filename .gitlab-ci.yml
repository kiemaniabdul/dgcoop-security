# CI/CD dgcoop-security (Keycloak + thème dgcoop)
# push deploy  → build image + redémarrage Keycloak sur le serveur
# push main/develop → build + push (pas de déploiement)
# merge_request → build uniquement (pas de push)

stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "sha-$CI_COMMIT_SHORT_SHA"

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

build-and-push:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|deploy)$/
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        if [ "$CI_COMMIT_BRANCH" = "deploy" ]; then
          docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
          docker push "$CI_REGISTRY_IMAGE:latest"
        fi
      fi

deploy:
  extends: .ssh_setup
  stage: deploy
  image: alpine:3.20
  needs: [build-and-push]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "deploy" && $CI_PIPELINE_SOURCE == "push"
  script:
    - export NEW_IMAGE="$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - |
      ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
        set -e
        cd /opt/dgcoop
        echo '$CI_REGISTRY_PASSWORD' | docker login '$CI_REGISTRY' -u '$CI_REGISTRY_USER' --password-stdin
        sed -i 's|^KEYCLOAK_IMAGE=.*|KEYCLOAK_IMAGE=$NEW_IMAGE|' .env
        docker compose -f docker-compose.postgres.yml -f docker-compose.keycloak.yml pull dgcoop-keycloak
        docker compose -f docker-compose.postgres.yml -f docker-compose.keycloak.yml up -d dgcoop-keycloak
        if docker ps --format '{{.Names}}' | grep -q '^dgcoop_keycloak$'; then
          admin_pass=\$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2- | tr -d '\r' || true)
          if [ -n \"\$admin_pass\" ]; then
            docker exec dgcoop_keycloak /opt/keycloak/bin/kcadm.sh config credentials \
              --server http://localhost:8081 --realm master \
              --user \"\${KEYCLOAK_ADMIN_USER:-admin}\" --password \"\$admin_pass\" >/dev/null 2>&1 || true
            docker exec dgcoop_keycloak /opt/keycloak/bin/kcadm.sh update realms/sisegpc \
              -s internationalizationEnabled=false \
              -s 'supportedLocales=[\"fr\"]' \
              -s defaultLocale=fr >/dev/null 2>&1 || true
            echo '→ Realm sisegpc : locale fr'
          fi
        fi
        if [ -x scripts/fix-keycloak-locale-fr.sh ]; then
          bash scripts/fix-keycloak-locale-fr.sh || true
        fi
        docker image prune -f
        docker logout '$CI_REGISTRY'
        echo '✓ Keycloak déployé : $NEW_IMAGE'
      "
