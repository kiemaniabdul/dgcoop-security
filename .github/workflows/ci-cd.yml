name: CI/CD dgcoop-security

# push deploy  → build image (thème dgcoop inclus) + redémarrage Keycloak sur le serveur
# push main/develop → build + push (pas de déploiement)
# pull_request → build uniquement

on:
  push:
    branches: [main, dev, develop, deploy]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: SHA court
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Référentiel GHCR (minuscules)
        id: ghcr
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/dgcoop-security" >> $GITHUB_OUTPUT

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/deploy' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copie des scripts ops sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "scripts/fix-keycloak-locale-fr.sh"
          target: /opt/dgcoop/scripts
          strip_components: 1

      - name: Image à déployer
        id: ghcr
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "new_image=ghcr.io/${OWNER}/dgcoop-security:sha-${{ needs.build-and-push.outputs.short-sha }}" >> $GITHUB_OUTPUT

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_ACTOR: ${{ github.actor }}
          NEW_IMAGE: ${{ steps.ghcr.outputs.new_image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: REGISTRY_TOKEN,GIT_ACTOR,NEW_IMAGE
          script: |
            set -e
            cd /opt/dgcoop

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GIT_ACTOR" --password-stdin

            sed -i "s|^KEYCLOAK_IMAGE=.*|KEYCLOAK_IMAGE=$NEW_IMAGE|" .env

            docker compose -f docker-compose.postgres.yml -f docker-compose.keycloak.yml pull dgcoop-keycloak
            docker compose -f docker-compose.postgres.yml -f docker-compose.keycloak.yml up -d dgcoop-keycloak

            # Locale FR (thème dgcoop) — même logique que scripts/fix-keycloak-locale-fr.sh (dgcoop-infra)
            if docker ps --format '{{.Names}}' | grep -q '^dgcoop_keycloak$'; then
              admin_pass="$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2- | tr -d '\r' || true)"
              if [[ -n "$admin_pass" ]]; then
                docker exec dgcoop_keycloak /opt/keycloak/bin/kcadm.sh config credentials \
                  --server "http://localhost:8081" --realm master \
                  --user "${KEYCLOAK_ADMIN_USER:-admin}" --password "$admin_pass" >/dev/null 2>&1 || true
                docker exec dgcoop_keycloak /opt/keycloak/bin/kcadm.sh update realms/sisegpc \
                  -s internationalizationEnabled=false \
                  -s 'supportedLocales=["fr"]' \
                  -s defaultLocale=fr >/dev/null 2>&1 || true
                echo "→ Realm sisegpc : locale fr"
              fi
            fi

            if [[ -x scripts/fix-keycloak-locale-fr.sh ]]; then
              bash scripts/fix-keycloak-locale-fr.sh || true
            fi

            docker image prune -f
            docker logout ghcr.io

            echo "✓ Keycloak déployé : $NEW_IMAGE"
