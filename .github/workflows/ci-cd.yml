name: CI/CD dgcoop-security

# push deploy  → build image (thème dgcoop inclus) + redémarrage Keycloak sur le serveur
# push main/develop → build + push (pas de déploiement)
# pull_request → build uniquement

on:
  push:
    branches: [main, dev, develop, deploy]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dgcoop-security

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: SHA court
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/deploy' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    environment: production

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_ACTOR: ${{ github.actor }}
          NEW_IMAGE: ghcr.io/${{ github.repository_owner }}/dgcoop-security:sha-${{ needs.build-and-push.outputs.short-sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: REGISTRY_TOKEN,GIT_ACTOR,NEW_IMAGE
          script: |
            set -e
            cd /opt/dgcoop

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GIT_ACTOR" --password-stdin

            sed -i "s|^KEYCLOAK_IMAGE=.*|KEYCLOAK_IMAGE=$NEW_IMAGE|" .env

            docker compose -f docker-compose.yml -f docker-compose.app.yml pull dgcoop-keycloak
            docker compose -f docker-compose.yml -f docker-compose.app.yml up -d dgcoop-keycloak

            docker image prune -f
            docker logout ghcr.io

            echo "✓ Keycloak déployé : $NEW_IMAGE"
